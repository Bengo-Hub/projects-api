components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT token from auth-service

  parameters:
    TenantID:
      name: tenantID
      in: path
      required: true
      schema:
        type: string
        format: uuid
      description: Tenant identifier

    ProjectID:
      name: projectID
      in: path
      required: true
      schema:
        type: string
        format: uuid
      description: Project identifier

    TaskID:
      name: taskID
      in: path
      required: true
      schema:
        type: string
        format: uuid
      description: Task identifier

    TenderID:
      name: tenderID
      in: path
      required: true
      schema:
        type: string
        format: uuid
      description: Tender identifier

    DocumentID:
      name: documentID
      in: path
      required: true
      schema:
        type: string
        format: uuid
      description: Document identifier

    CommitteeID:
      name: committeeID
      in: path
      required: true
      schema:
        type: string
        format: uuid
      description: Committee identifier

    MemberID:
      name: memberID
      in: path
      required: true
      schema:
        type: string
        format: uuid
      description: Committee member identifier

    EvaluationID:
      name: evaluationID
      in: path
      required: true
      schema:
        type: string
        format: uuid
      description: Evaluation identifier

    MeetingID:
      name: meetingID
      in: path
      required: true
      schema:
        type: string
        format: uuid
      description: Meeting identifier

    SectionID:
      name: sectionID
      in: path
      required: true
      schema:
        type: string
        format: uuid
      description: Section identifier

    SubmissionID:
      name: submissionID
      in: path
      required: true
      schema:
        type: string
        format: uuid
      description: Submission identifier

    Limit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
      description: Maximum number of items to return

    Offset:
      name: offset
      in: query
      schema:
        type: integer
        minimum: 0
        default: 0
      description: Number of items to skip

  schemas:
    ProjectStatus:
      type: string
      enum: [active, planning, on_hold, completed, cancelled]
      description: Project lifecycle status

    TaskStatus:
      type: string
      enum: [todo, in_progress, in_review, done, blocked]
      description: Task workflow status

    Priority:
      type: string
      enum: [low, medium, high, critical]
      description: Priority level

    TenderStatus:
      type: string
      enum: [identified, evaluating, preparing, submitted, under_review, shortlisted, awarded, lost, withdrawn]
      description: Tender lifecycle status

    TenderSource:
      type: string
      enum: [manual, government_portal, referral, website]
      description: Source where tender was discovered

    TenderDocumentType:
      type: string
      enum: [rfp, rfq, tor, specification, evaluation_criteria, contract_template, addendum, clarification, response, other]
      description: Type of tender document

    SubmissionMethod:
      type: string
      enum: [email, physical, portal, mixed]
      description: How the tender should be submitted

    CommitteeType:
      type: string
      enum: [evaluation, technical, financial, legal, compliance]
      description: Type of committee

    CommitteeStatus:
      type: string
      enum: [active, dissolved]
      description: Committee status

    MemberRole:
      type: string
      enum: [chair, secretary, member, observer]
      description: Committee member role

    EvaluationVote:
      type: string
      enum: [approve, reject, abstain, defer]
      description: Evaluator vote

    MeetingType:
      type: string
      enum: [evaluation, kickoff, review, decision, clarification]
      description: Type of meeting

    MeetingStatus:
      type: string
      enum: [scheduled, in_progress, completed, cancelled]
      description: Meeting status

    MeetingPlatform:
      type: string
      enum: [google_meet, teams, zoom, zoho_meet]
      description: Virtual meeting platform

    SectionType:
      type: string
      enum: [executive_summary, technical, approach, methodology, pricing, appendix, cover_letter, references, qualifications, other]
      description: Type of tender response section

    SectionStatus:
      type: string
      enum: [not_started, in_progress, review, approved, rejected]
      description: Section workflow status

    ReviewStatus:
      type: string
      enum: [pending_technical, pending_legal, pending_management, approved, rejected]
      description: Section review status

    SubmissionType:
      type: string
      enum: [email, physical, portal]
      description: How the tender was submitted

    SubmissionStatus:
      type: string
      enum: [draft, preparing, submitted, confirmed, rejected]
      description: Submission status

    LivenessResponse:
      type: object
      required: [status, service]
      properties:
        status:
          type: string
          example: ok
        service:
          type: string
          example: projects-service

    ReadinessResponse:
      type: object
      required: [status, dependencies]
      properties:
        status:
          type: string
          example: OK
        dependencies:
          type: object
          additionalProperties:
            type: string
          example:
            postgres: ""
            redis: ""
            nats: ""

    CreateProjectRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 255
          example: Website Redesign
        description:
          type: string
          maxLength: 2000
        status:
          $ref: '#/components/schemas/ProjectStatus'
        start_date:
          type: string
          format: date-time
        end_date:
          type: string
          format: date-time
        budget:
          type: number
          format: double
          minimum: 0
        currency:
          type: string
          minLength: 3
          maxLength: 3
          example: USD
        metadata:
          type: object
          additionalProperties: true

    UpdateProjectRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 255
        description:
          type: string
          maxLength: 2000
        status:
          $ref: '#/components/schemas/ProjectStatus'
        start_date:
          type: string
          format: date-time
        end_date:
          type: string
          format: date-time
        budget:
          type: number
          format: double
          minimum: 0
        currency:
          type: string
          minLength: 3
          maxLength: 3
        metadata:
          type: object
          additionalProperties: true

    ProjectResponse:
      type: object
      required: [id, tenant_id, name, status, currency, owner_id, created_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
        tenant_id:
          type: string
          format: uuid
        name:
          type: string
        description:
          type: string
        status:
          $ref: '#/components/schemas/ProjectStatus'
        start_date:
          type: string
          format: date-time
        end_date:
          type: string
          format: date-time
        budget:
          type: number
          format: double
        currency:
          type: string
        owner_id:
          type: string
          format: uuid
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        metadata:
          type: object
          additionalProperties: true

    ListProjectsResponse:
      type: object
      required: [projects, total, limit, offset]
      properties:
        projects:
          type: array
          items:
            $ref: '#/components/schemas/ProjectResponse'
        total:
          type: integer
        limit:
          type: integer
        offset:
          type: integer

    CreateTaskRequest:
      type: object
      required: [title]
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 255
          example: Implement login page
        description:
          type: string
          maxLength: 2000
        status:
          $ref: '#/components/schemas/TaskStatus'
        priority:
          $ref: '#/components/schemas/Priority'
        assignee_id:
          type: string
          format: uuid
        due_date:
          type: string
          format: date-time
        metadata:
          type: object
          additionalProperties: true

    UpdateTaskRequest:
      type: object
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 255
        description:
          type: string
          maxLength: 2000
        status:
          $ref: '#/components/schemas/TaskStatus'
        priority:
          $ref: '#/components/schemas/Priority'
        assignee_id:
          type: string
          format: uuid
        due_date:
          type: string
          format: date-time
        metadata:
          type: object
          additionalProperties: true

    TaskResponse:
      type: object
      required: [id, tenant_id, project_id, title, status, priority, created_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
        tenant_id:
          type: string
          format: uuid
        project_id:
          type: string
          format: uuid
        title:
          type: string
        description:
          type: string
        status:
          $ref: '#/components/schemas/TaskStatus'
        priority:
          $ref: '#/components/schemas/Priority'
        assignee_id:
          type: string
          format: uuid
        due_date:
          type: string
          format: date-time
        completed_at:
          type: string
          format: date-time
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        metadata:
          type: object
          additionalProperties: true

    ListTasksResponse:
      type: object
      required: [tasks, total, limit, offset]
      properties:
        tasks:
          type: array
          items:
            $ref: '#/components/schemas/TaskResponse'
        total:
          type: integer
        limit:
          type: integer
        offset:
          type: integer

    CreateUserRequest:
      type: object
      required: [email, tenant_slug]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          format: password
        tenant_slug:
          type: string
        profile:
          type: object
          additionalProperties: true
        roles:
          type: array
          items:
            type: string

    CreateUserResponse:
      type: object
      properties:
        user_id:
          type: string
          format: uuid
        email:
          type: string
        tenant_id:
          type: string
          format: uuid
        created:
          type: boolean

    UserRolesResponse:
      type: object
      properties:
        roles:
          type: array
          items:
            $ref: '#/components/schemas/RoleResponse'

    RoleResponse:
