openapi: 3.0.3
info:
  title: Projects Service API
  description: |
    Multi-tenant project and task management API for BengoBox platform.

    ## Authentication
    All endpoints (except health checks) require a valid JWT token in the Authorization header.

    ## Multi-tenancy
    All resource endpoints are scoped to a tenant via the `{tenantID}` path parameter.
  version: 1.0.0
  contact:
    name: BengoBox Platform Team
    email: platform@bengobox.com

servers:
  - url: http://localhost:8080/api/v1
    description: Local development
  - url: https://api.bengobox.com/api/v1
    description: Production

tags:
  - name: Health
    description: Service health and readiness checks
  - name: Projects
    description: Project management operations
  - name: Tasks
    description: Task management operations (nested under projects)
  - name: Users
    description: User management and RBAC operations
  - name: Tenders
    description: Tender management and evaluation operations
  - name: Tender Documents
    description: Tender document management with versioning
  - name: Tender Committees
    description: Tender committee and member management
  - name: Tender Evaluations
    description: Tender evaluation and scoring operations
  - name: Tender Meetings
    description: Tender meeting scheduling and management
  - name: Tender Sections
    description: Tender response section management
  - name: Tender Submissions
    description: Tender submission tracking

paths:
  /healthz:
    get:
      summary: Liveness probe
      description: Returns OK if the service process is running
      tags: [Health]
      security: []
      responses:
        '200':
          description: Service is alive
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LivenessResponse'

  /readyz:
    get:
      summary: Readiness probe
      description: Checks connectivity to all downstream dependencies
      tags: [Health]
      security: []
      responses:
        '200':
          description: All dependencies healthy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReadinessResponse'
        '503':
          description: One or more dependencies unhealthy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReadinessResponse'

  /metrics:
    get:
      summary: Prometheus metrics
      description: Exposes Prometheus-formatted metrics
      tags: [Health]
      security: []
      responses:
        '200':
          description: Metrics in Prometheus format
          content:
            text/plain:
              schema:
                type: string

  /{tenantID}/projects:
    parameters:
      - $ref: '#/components/parameters/TenantID'
    get:
      summary: List projects
      description: Returns a paginated list of projects for the tenant
      tags: [Projects]
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
        - name: status
          in: query
          schema:
            $ref: '#/components/schemas/ProjectStatus'
        - name: owner_id
          in: query
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: List of projects
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListProjectsResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

    post:
      summary: Create project
      description: Creates a new project in the tenant
      tags: [Projects]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateProjectRequest'
      responses:
        '201':
          description: Project created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/ValidationError'

  /{tenantID}/projects/{projectID}:
    parameters:
      - $ref: '#/components/parameters/TenantID'
      - $ref: '#/components/parameters/ProjectID'
    get:
      summary: Get project
      description: Returns a single project by ID
      tags: [Projects]
      responses:
        '200':
          description: Project details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectResponse'
        '404':
          $ref: '#/components/responses/NotFound'

    patch:
      summary: Update project
      description: Updates an existing project
      tags: [Projects]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateProjectRequest'
      responses:
        '200':
          description: Project updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectResponse'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'

    delete:
      summary: Delete project
      description: Deletes a project and all associated tasks
      tags: [Projects]
      responses:
        '204':
          description: Project deleted
        '404':
          $ref: '#/components/responses/NotFound'

  /{tenantID}/projects/{projectID}/tasks:
    parameters:
      - $ref: '#/components/parameters/TenantID'
      - $ref: '#/components/parameters/ProjectID'
    get:
      summary: List tasks
      description: Returns a paginated list of tasks for the project
      tags: [Tasks]
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
        - name: status
          in: query
          schema:
            $ref: '#/components/schemas/TaskStatus'
        - name: priority
          in: query
          schema:
            $ref: '#/components/schemas/Priority'
        - name: assignee_id
          in: query
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: List of tasks
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListTasksResponse'
        '404':
          $ref: '#/components/responses/NotFound'

    post:
      summary: Create task
      description: Creates a new task in the project
      tags: [Tasks]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTaskRequest'
      responses:
        '201':
          description: Task created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskResponse'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'

  /{tenantID}/projects/{projectID}/tasks/{taskID}:
    parameters:
      - $ref: '#/components/parameters/TenantID'
      - $ref: '#/components/parameters/ProjectID'
      - $ref: '#/components/parameters/TaskID'
    get:
      summary: Get task
      description: Returns a single task by ID
      tags: [Tasks]
      responses:
        '200':
          description: Task details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskResponse'
        '404':
          $ref: '#/components/responses/NotFound'

    patch:
      summary: Update task
      description: Updates an existing task
      tags: [Tasks]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateTaskRequest'
      responses:
        '200':
          description: Task updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskResponse'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'

    delete:
      summary: Delete task
      description: Deletes a task
      tags: [Tasks]
      responses:
        '204':
          description: Task deleted
        '404':
          $ref: '#/components/responses/NotFound'

  /{tenantID}/users:
    parameters:
      - $ref: '#/components/parameters/TenantID'
    post:
      summary: Create user
      description: Creates a new user and syncs with auth-service
      tags: [Users]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateUserRequest'
      responses:
        '201':
          description: User created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateUserResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /{tenantID}/users/me/roles:
    parameters:
      - $ref: '#/components/parameters/TenantID'
    get:
      summary: Get current user roles
      description: Returns roles assigned to the authenticated user
      tags: [Users]
      responses:
        '200':
          description: User roles
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserRolesResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /{tenantID}/roles:
    parameters:
      - $ref: '#/components/parameters/TenantID'
    get:
      summary: List roles
      description: Returns all available roles
      tags: [Users]
      responses:
        '200':
          description: List of roles
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListRolesResponse'

  /{tenantID}/tenders:
    parameters:
      - $ref: '#/components/parameters/TenantID'
    get:
      summary: List tenders
      description: Returns a paginated list of tenders for the tenant
      tags: [Tenders]
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
        - name: status
          in: query
          schema:
            $ref: '#/components/schemas/TenderStatus'
        - name: priority
          in: query
          schema:
            $ref: '#/components/schemas/Priority'
        - name: source
          in: query
          schema:
            $ref: '#/components/schemas/TenderSource'
        - name: created_by
          in: query
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: List of tenders
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListTendersResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

    post:
      summary: Create tender
      description: Creates a new tender opportunity with auto-generated tender number
      tags: [Tenders]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTenderRequest'
      responses:
        '201':
          description: Tender created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TenderResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/ValidationError'

  /{tenantID}/tenders/{tenderID}:
    parameters:
      - $ref: '#/components/parameters/TenantID'
      - $ref: '#/components/parameters/TenderID'
    get:
      summary: Get tender
      description: Returns a single tender by ID
      tags: [Tenders]
      responses:
        '200':
          description: Tender details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TenderResponse'
        '404':
          $ref: '#/components/responses/NotFound'

    patch:
      summary: Update tender
      description: Updates an existing tender
      tags: [Tenders]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateTenderRequest'
      responses:
        '200':
          description: Tender updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TenderResponse'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'

    delete:
      summary: Delete tender
      description: Deletes a tender and all associated data
      tags: [Tenders]
      responses:
        '204':
          description: Tender deleted
        '404':
          $ref: '#/components/responses/NotFound'

  /{tenantID}/tenders/{tenderID}/decision:
    parameters:
      - $ref: '#/components/parameters/TenantID'
      - $ref: '#/components/parameters/TenderID'
    post:
      summary: Record tender decision
      description: Records a go/no-go decision for a tender
      tags: [Tenders]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TenderDecisionRequest'
      responses:
        '200':
          description: Decision recorded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TenderResponse'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'

  /{tenantID}/tenders/{tenderID}/documents:
    parameters:
      - $ref: '#/components/parameters/TenantID'
      - $ref: '#/components/parameters/TenderID'
    get:
      summary: List tender documents
      description: Returns documents for a tender
      tags: [Tender Documents]
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
        - name: document_type
          in: query
          schema:
            $ref: '#/components/schemas/TenderDocumentType'
        - name: latest_only
          in: query
          schema:
            type: boolean
            default: false
      responses:
        '200':
          description: List of documents
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListTenderDocumentsResponse'
        '404':
          $ref: '#/components/responses/NotFound'

    post:
      summary: Upload tender document
      description: Creates a new document for a tender
      tags: [Tender Documents]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTenderDocumentRequest'
      responses:
        '201':
          description: Document created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TenderDocumentResponse'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'

  /{tenantID}/tenders/{tenderID}/documents/{documentID}:
    parameters:
      - $ref: '#/components/parameters/TenantID'
      - $ref: '#/components/parameters/TenderID'
      - $ref: '#/components/parameters/DocumentID'
    get:
      summary: Get document
      description: Returns a single document by ID
      tags: [Tender Documents]
      responses:
        '200':
          description: Document details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TenderDocumentResponse'
        '404':
          $ref: '#/components/responses/NotFound'

    patch:
      summary: Update document
      description: Updates document metadata
      tags: [Tender Documents]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateTenderDocumentRequest'
      responses:
        '200':
          description: Document updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TenderDocumentResponse'
        '404':
          $ref: '#/components/responses/NotFound'

    delete:
      summary: Delete document
      description: Deletes a document
      tags: [Tender Documents]
      responses:
        '204':
          description: Document deleted
        '404':
          $ref: '#/components/responses/NotFound'

  /{tenantID}/tenders/{tenderID}/documents/{documentID}/versions:
    parameters:
      - $ref: '#/components/parameters/TenantID'
      - $ref: '#/components/parameters/TenderID'
      - $ref: '#/components/parameters/DocumentID'
    post:
      summary: Create document version
      description: Creates a new version of an existing document
      tags: [Tender Documents]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTenderDocumentRequest'
      responses:
        '201':
          description: New version created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TenderDocumentResponse'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'

  # Tender Committee Endpoints
  /{tenantID}/tenders/{tenderID}/committees:
    parameters:
      - $ref: '#/components/parameters/TenantID'
      - $ref: '#/components/parameters/TenderID'
    get:
      summary: List committees
      description: Returns committees for a tender
      tags: [Tender Committees]
      responses:
        '200':
          description: List of committees
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListCommitteesResponse'
        '404':
          $ref: '#/components/responses/NotFound'

    post:
      summary: Create committee
      description: Creates a new evaluation committee for a tender
      tags: [Tender Committees]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCommitteeRequest'
      responses:
        '201':
          description: Committee created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommitteeResponse'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'

  /{tenantID}/tenders/{tenderID}/committees/{committeeID}:
    parameters:
      - $ref: '#/components/parameters/TenantID'
      - $ref: '#/components/parameters/TenderID'
      - $ref: '#/components/parameters/CommitteeID'
    get:
      summary: Get committee
      description: Returns a committee with its members
      tags: [Tender Committees]
      responses:
        '200':
          description: Committee details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommitteeResponse'
        '404':
          $ref: '#/components/responses/NotFound'

    patch:
      summary: Update committee
      description: Updates committee details
      tags: [Tender Committees]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateCommitteeRequest'
      responses:
        '200':
          description: Committee updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommitteeResponse'
        '404':
          $ref: '#/components/responses/NotFound'

    delete:
      summary: Delete committee
      description: Deletes a committee
      tags: [Tender Committees]
      responses:
        '204':
          description: Committee deleted
        '404':
          $ref: '#/components/responses/NotFound'

  /{tenantID}/tenders/{tenderID}/committees/{committeeID}/dissolve:
    parameters:
      - $ref: '#/components/parameters/TenantID'
      - $ref: '#/components/parameters/TenderID'
      - $ref: '#/components/parameters/CommitteeID'
    post:
      summary: Dissolve committee
      description: Marks a committee as dissolved
      tags: [Tender Committees]
      responses:
        '200':
          description: Committee dissolved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommitteeResponse'
        '404':
          $ref: '#/components/responses/NotFound'

  /{tenantID}/tenders/{tenderID}/committees/{committeeID}/members:
    parameters:
      - $ref: '#/components/parameters/TenantID'
      - $ref: '#/components/parameters/TenderID'
      - $ref: '#/components/parameters/CommitteeID'
    post:
      summary: Add member
      description: Adds a member to a committee
      tags: [Tender Committees]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddMemberRequest'
      responses:
        '201':
          description: Member added
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MemberResponse'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: User is already a member
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /{tenantID}/tenders/{tenderID}/committees/{committeeID}/members/{memberID}:
    parameters:
      - $ref: '#/components/parameters/TenantID'
      - $ref: '#/components/parameters/TenderID'
      - $ref: '#/components/parameters/CommitteeID'
      - $ref: '#/components/parameters/MemberID'
    get:
      summary: Get member
      description: Returns a committee member
      tags: [Tender Committees]
      responses:
        '200':
          description: Member details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MemberResponse'
        '404':
          $ref: '#/components/responses/NotFound'

    patch:
      summary: Update member
      description: Updates member details
      tags: [Tender Committees]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateMemberRequest'
      responses:
        '200':
          description: Member updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MemberResponse'
        '404':
          $ref: '#/components/responses/NotFound'

    delete:
      summary: Remove member
      description: Removes a member from a committee
      tags: [Tender Committees]
      responses:
        '204':
          description: Member removed
        '404':
          $ref: '#/components/responses/NotFound'

  # Tender Evaluation Endpoints
  /{tenantID}/tenders/{tenderID}/evaluations:
    parameters:
      - $ref: '#/components/parameters/TenantID'
      - $ref: '#/components/parameters/TenderID'
    get:
      summary: List evaluations
      description: Returns evaluations for a tender
      tags: [Tender Evaluations]
      responses:
        '200':
          description: List of evaluations
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListEvaluationsResponse'
        '404':
          $ref: '#/components/responses/NotFound'

    post:
      summary: Create evaluation
      description: Creates a new evaluation for a tender
      tags: [Tender Evaluations]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateEvaluationRequest'
      responses:
        '201':
          description: Evaluation created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EvaluationResponse'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'

  /{tenantID}/tenders/{tenderID}/evaluations/summary:
    parameters:
      - $ref: '#/components/parameters/TenantID'
      - $ref: '#/components/parameters/TenderID'
    get:
      summary: Get evaluation summary
      description: Returns aggregated evaluation data for a tender
      tags: [Tender Evaluations]
      responses:
        '200':
          description: Evaluation summary
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EvaluationSummary'
        '404':
          $ref: '#/components/responses/NotFound'

  /{tenantID}/tenders/{tenderID}/evaluations/{evaluationID}:
    parameters:
      - $ref: '#/components/parameters/TenantID'
      - $ref: '#/components/parameters/TenderID'
      - $ref: '#/components/parameters/EvaluationID'
    get:
      summary: Get evaluation
      description: Returns an evaluation by ID
      tags: [Tender Evaluations]
      responses:
        '200':
          description: Evaluation details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EvaluationResponse'
        '404':
          $ref: '#/components/responses/NotFound'

    patch:
      summary: Update evaluation
      description: Updates an evaluation
      tags: [Tender Evaluations]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateEvaluationRequest'
      responses:
        '200':
          description: Evaluation updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EvaluationResponse'
        '404':
          $ref: '#/components/responses/NotFound'

    delete:
      summary: Delete evaluation
      description: Deletes an evaluation
      tags: [Tender Evaluations]
      responses:
        '204':
          description: Evaluation deleted
        '404':
          $ref: '#/components/responses/NotFound'

  /{tenantID}/tenders/{tenderID}/evaluations/{evaluationID}/submit:
    parameters:
      - $ref: '#/components/parameters/TenantID'
      - $ref: '#/components/parameters/TenderID'
      - $ref: '#/components/parameters/EvaluationID'
    post:
      summary: Submit evaluation
      description: Marks an evaluation as final/submitted
      tags: [Tender Evaluations]
      responses:
        '200':
          description: Evaluation submitted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EvaluationResponse'
        '404':
          $ref: '#/components/responses/NotFound'

  # Tender Meeting Endpoints
  /{tenantID}/tenders/{tenderID}/meetings:
    parameters:
      - $ref: '#/components/parameters/TenantID'
      - $ref: '#/components/parameters/TenderID'
    get:
      summary: List meetings
      description: Returns meetings for a tender
      tags: [Tender Meetings]
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
        - name: status
          in: query
          schema:
            $ref: '#/components/schemas/MeetingStatus'
        - name: meeting_type
          in: query
          schema:
